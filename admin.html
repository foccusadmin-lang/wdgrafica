<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel ADM | Grupo WD</title>
<meta name="robots" content="noindex">
<link rel="icon" href="img/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1d1d1f">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--gold:#c9a227;--gold-dark:#a5811a;--ink:#1d1d1f;--muted:#6b6b70;--bg:#f6f6f7;--line:#e6e6ea;--c:#00a8e1;--m:#e6007e;--y:#ffd400;--k:#2b2b2b;--wa:#25d366}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Montserrat,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
  a{color:inherit}
  .cmyk{height:5px;background:linear-gradient(90deg,var(--c) 0 25%,var(--m) 25% 50%,var(--y) 50% 75%,var(--k) 75%)}
  header{background:var(--ink);color:#fff}
  .head{max-width:1200px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .head img{width:44px;height:44px;border-radius:50%}
  .head h1{font-size:18px;flex:1}
  .head h1 small{display:block;font-size:11px;color:var(--gold);font-weight:600}
  .head a,.head button{color:#fff;background:none;border:1px solid #555;border-radius:999px;padding:7px 14px;font:inherit;font-size:13px;cursor:pointer;text-decoration:none}
  main{max-width:1200px;margin:0 auto;padding:20px 16px 60px}
  .tabs{display:flex;gap:6px;margin-bottom:16px;overflow-x:auto}
  .tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer;white-space:nowrap}
  .tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
  .center{max-width:420px;margin:60px auto;text-align:center}
  .center img{width:120px;border-radius:50%;margin:0 auto 16px;display:block}
  .btn{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer;background:var(--ink);color:#fff;text-decoration:none;white-space:nowrap}
  .btn.gold{background:var(--gold)} .btn.light{background:#eee;color:var(--ink)} .btn.sm{padding:6px 12px;font-size:12px}
  .btn.red{background:var(--m)} .btn.wa{background:var(--wa)}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
  .stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}
  .stat b{display:block;font-size:22px}
  .stat span{color:var(--muted);font-size:12px}
  .ped-hd{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start}
  .ped-hd b{font-size:15px}
  .muted{color:var(--muted);font-size:12px}
  .itens{margin:10px 0;border-top:1px dashed var(--line);padding-top:8px}
  .itens div{padding:2px 0}
  select,input,textarea{border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;font-size:13px;width:100%;background:#fff}
  textarea{resize:vertical}
  .st{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:#eee;white-space:nowrap}
  .st-aguardando_pagamento,.st-novo{background:#fff4e5;color:#8a4b00}.st-arte_analise{background:#e0f6fd;color:#00769e}.st-producao{background:#fff7cc;color:#8a6d00}
  .st-pronto{background:#e3f9e5;color:#137333}.st-finalizado,.st-entregue{background:#ececec;color:#444}.st-cancelado{background:#fde0f0;color:#a3005a}
  .pg-aprovado{background:#e3f9e5;color:#137333}.pg-pendente{background:#fff4e5;color:#8a4b00}.pg-recusado,.pg-estornado{background:#fde0f0;color:#a3005a}
  .filters{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  .filters select,.filters input{width:auto;flex:1;min-width:150px}
  .cli{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;background:var(--bg);border-radius:10px;padding:10px 12px;font-size:13px;margin:8px 0}
  .cli .w{grid-column:1/-1}
  .cli b{font-weight:700}
  .row-act{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
  .aviso{background:#fff4e5;border:1px solid #f0b46a;color:#8a4b00;border-radius:10px;padding:8px 10px;font-size:12px;margin-bottom:8px}
  .lista-prod{display:grid;gap:8px}
  .lp{display:grid;grid-template-columns:56px 1fr auto;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
  .lp img{width:56px;height:56px;object-fit:cover;border-radius:8px;background:#eee}
  .lp h4{font-size:14px}
  .badge{display:inline-block;font-size:10px;font-weight:800;padding:2px 7px;border-radius:999px;margin-left:4px;vertical-align:middle;background:#eee;color:#555}
  .b-promo{background:#e11d48;color:#fff}.b-ed{background:#e0f6fd;color:#00769e}.b-novo{background:#e3f9e5;color:#137333}.b-off{background:#333;color:#fff}
  .ed{display:grid;grid-template-columns:240px 1fr;gap:18px}
  .ed-foto img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:#eee;border:1px solid var(--line)}
  .ed label{font-size:11px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;gap:3px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
  .chips span{background:#ece4fb;color:#5b1fa8;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:700}
  .chips button{border:0;background:none;color:#5b1fa8;cursor:pointer;font-weight:800;margin-left:4px}
  details.var{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fff}
  details.var summary{padding:10px 12px;cursor:pointer;font-weight:700;font-size:13px}
  .var-bd{padding:0 12px 12px}
  .qt{width:100%;border-collapse:collapse;margin-top:8px}
  .qt td,.qt th{padding:4px 6px;border-bottom:1px solid var(--line);font-size:12px}
  .qt input{padding:6px}
  .check{display:flex!important;flex-direction:row!important;gap:6px;align-items:center;font-size:13px!important;color:var(--ink)!important}
  .check input{width:auto}
  .toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(100px);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;transition:transform .25s;z-index:9}
  .toast.show{transform:translateX(-50%) translateY(0)}
  @media (max-width:760px){ .ed{grid-template-columns:1fr} .ed-foto{max-width:240px} .grid3{grid-template-columns:1fr 1fr} .cli{grid-template-columns:1fr} .lp{grid-template-columns:48px 1fr} .lp>div:last-child{grid-column:1/-1} }
</style>
</head>
<body>
<header>
  <div class="head">
    <img src="img/logo.jpg" alt="">
    <h1>Painel Administrativo<small>GRUPO WD</small></h1>
    <a href="./">← Ver site</a>
    <button id="btnSair" style="display:none" onclick="WD.sair()">Sair</button>
  </div>
  <div class="cmyk"></div>
</header>

<main id="app"><div class="center"><p class="muted">Carregando...</p></div></main>
<div class="toast" id="toast"></div>

<script src="js/precos.js"></script>
<script type="module">
import * as WD from './js/wd-firebase.js';
window.WD = WD;
const $ = id => document.getElementById(id);
const app = $('app');
const brl = v => (+v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
const so = s => String(s || '').replace(/\D/g, '');
const data = t => t?.seconds ? new Date(t.seconds * 1000).toLocaleString('pt-BR') : '';
const fmtDoc = (d, t) => t === 'PJ' ? so(d).replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2}).*/, '$1.$2.$3/$4-$5') : so(d).replace(/^(\d{3})(\d{3})(\d{3})(\d{2}).*/, '$1.$2.$3-$4');
const fmtTel = t => so(t).replace(/^(\d{2})(\d{4,5})(\d{4}).*/, '($1) $2-$3');
const fmtCep = c => so(c).replace(/^(\d{5})(\d{3}).*/, '$1-$2');
const waCli = (tel, msg) => `https://wa.me/55${so(tel)}?text=${encodeURIComponent(msg)}`;
const num6 = id => String(id).slice(0, 6).toUpperCase();
const STATUS = { aguardando_pagamento: 'Aguardando pagamento', arte_analise: 'Arte em análise', producao: 'Em produção',
  pronto: 'Pronto para envio/retirada', finalizado: 'Finalizado', cancelado: 'Cancelado' };
const STATUS_ANTIGO = { novo: 'aguardando_pagamento', entregue: 'finalizado' };
const stNome = s => STATUS[s] || STATUS[STATUS_ANTIGO[s]] || s;
const PAGTO = { pix: 'PIX', cartao: 'Cartão', whatsapp: 'Combinar pelo WhatsApp' };
const PGST = { pendente: 'Pendente', aprovado: 'Pago', recusado: 'Recusado', estornado: 'Estornado' };
let tt; const toast = t => { $('toast').textContent = t; $('toast').classList.add('show'); clearTimeout(tt); tt = setTimeout(() => $('toast').classList.remove('show'), 2200); };

let aba = 'pedidos', pedidos = [], CAT = null, FAM = {}, ajustes = {}, clientes = [], config = {};
let filtro = { status: '', metodo: '', q: '' }, filtroCli = '', filtroProd = '', editando = null;
const mult = () => config.mult || CAT?.mult || 2.5;

WD.aoMudarUsuario(u => {
  $('btnSair').style.display = u ? 'inline-block' : 'none';
  if (!u) {
    app.innerHTML = `<div class="center box"><img src="img/logo.jpg" alt=""><h2>Acesso restrito</h2>
      <p class="muted" style="margin:8px 0 18px">Entre com a conta Google administradora.</p>
      <button class="btn gold" id="btnEntrar">Entrar com Google</button></div>`;
    $('btnEntrar').onclick = () => WD.entrar().catch(e => alert(e.message));
  } else if (!WD.ehAdmin(u)) {
    app.innerHTML = `<div class="center box"><h2>Acesso negado</h2>
      <p class="muted" style="margin:8px 0 18px">A conta <b>${esc(u.email)}</b> não tem permissão de administrador.</p>
      <button class="btn" onclick="WD.sair()">Entrar com outra conta</button></div>`;
  } else carregar();
});

async function carregar() {
  app.innerHTML = '<div class="center"><p class="muted">Carregando dados...</p></div>';
  try {
    [pedidos, CAT, ajustes, clientes, config] = await Promise.all([WD.todosPedidos(), fetch('data/indice.json', { cache: 'no-cache' }).then(r => r.json()),
      WD.lerAjustes(), WD.todosClientes(), WD.lerConfig()]);
    // produtos criados no painel entram na lista
    for (const [s, a] of Object.entries(ajustes)) if (a.novo && a.resumo && !CAT.fams[s]) CAT.fams[s] = { n: a.nome, img: '', p: a.resumo.p, s: a.resumo.s || '', c: a.resumo.c || 1 };
    const usados = [...new Set(pedidos.flatMap(p => (p.itens || []).map(i => i.fam)).filter(Boolean))];
    await Promise.all(usados.map(famData));
    render();
  } catch (e) {
    console.error(e);
    app.innerHTML = `<div class="center box"><h2>Erro ao carregar</h2><p class="muted">${esc(e.message)}</p></div>`;
  }
}
// dados completos de um produto: editado no painel (preço final) ou do catálogo (referência)
async function famData(s) {
  if (FAM[s] !== undefined) return FAM[s];
  const a = ajustes[s];
  FAM[s] = (a?.editado || a?.novo) ? await WD.lerProduto(s).catch(() => null)
    : await fetch('data/p/' + s + '.json').then(r => r.ok ? r.json() : null).catch(() => null);
  return FAM[s];
}

function render() {
  const ativos = pedidos.filter(p => !['finalizado', 'cancelado', 'entregue'].includes(p.status));
  const pagos = pedidos.filter(p => p.pagamento?.status === 'aprovado' && p.status !== 'cancelado').reduce((s, p) => s + (+p.total || 0), 0);
  app.innerHTML = `
    <div class="stats">
      <div class="stat"><b>${pedidos.filter(p => ['aguardando_pagamento', 'novo'].includes(p.status)).length}</b><span>Aguardando pagamento</span></div>
      <div class="stat"><b>${ativos.length}</b><span>Pedidos em aberto</span></div>
      <div class="stat"><b>${brl(pagos)}</b><span>Recebido (pagos)</span></div>
      <div class="stat"><b>${clientes.length}</b><span>Clientes</span></div>
    </div>
    <div class="tabs">
      ${[['pedidos', '📦 Pedidos'], ['clientes', '👥 Clientes'], ['produtos', '🏷️ Produtos'], ['config', '⚙️ Configurações']].map(([k, t]) =>
        `<button class="${aba === k ? 'on' : ''}" data-aba="${k}">${t}</button>`).join('')}
      <button data-recarregar>🔄 Atualizar</button>
    </div>
    <div id="conteudo"></div>`;
  app.querySelectorAll('[data-aba]').forEach(b => b.onclick = () => { aba = b.dataset.aba; editando = null; render(); });
  app.querySelector('[data-recarregar]').onclick = () => { FAM = {}; carregar(); };
  ({ pedidos: renderPedidos, clientes: renderClientes, produtos: () => editando ? renderEditor() : renderProdutos(), config: renderConfig })[aba]();
}
function manterFoco(id, fn) {
  const el = $(id); el.oninput = e => { const pos = e.target.selectionStart; fn(e.target.value); $(id).focus(); $(id).setSelectionRange(pos, pos); };
}

/* ================= PEDIDOS ================= */
// O preço vem do navegador do cliente (pedidos via WhatsApp): confere com o catálogo atual.
function conferir(p) {
  if (p.pagamento && p.pagamento.metodo !== 'whatsapp') return []; // pedidos pagos online já são calculados pelo servidor
  const avisos = []; let soma = 0;
  for (const i of p.itens || []) {
    const q = +i.q || 0; soma += (+i.preco || 0) * q;
    if (!Number.isInteger(q) || q < 1) avisos.push(`${i.nome}: quantidade inválida`);
    if (!i.fam) continue;
    const r = PRECOS.item({ prod: FAM[i.fam], aj: ajustes[i.fam], mult: mult(), servicos: CAT.servicos }, { sku: i.id, qtd: i.qtd, ex: i.ex, sv: i.sv });
    if (!r) { avisos.push(`"${i.nome}" (${i.un || ''}) não está mais no catálogo`); continue; }
    if (Math.abs(r.unit - i.preco) > 0.01) avisos.push(`${i.nome} (${i.un || ''}): ${brl(i.preco)} no pedido, catálogo hoje ${brl(r.unit)}`);
  }
  if (Math.abs(soma - p.total) > 0.01) avisos.push(`Total do pedido (${brl(p.total)}) não bate com a soma dos itens (${brl(soma)})`);
  return avisos;
}
function blocoCliente(c, p) {
  if (!c) return `<div class="cli"><span class="w muted">Pedido antigo, sem ficha de cadastro. Nome: ${esc(p.nome || '—')} · ${esc(p.email || '')}</span></div>`;
  const e = c.endereco || {};
  return `<div class="cli">
    <span><b>${esc(c.nome)}</b> <span class="muted">(${c.tipo === 'PJ' ? 'Pessoa jurídica' : 'Pessoa física'})</span></span>
    <span>${c.tipo === 'PJ' ? 'CNPJ' : 'CPF'}: <b>${esc(fmtDoc(c.doc, c.tipo))}</b>${c.rg ? ` · RG: ${esc(c.rg)}` : ''}</span>
    <span>📱 ${esc(fmtTel(c.telefone))}</span><span>✉️ ${esc(p?.email || '')}</span>
    <span class="w">📍 ${esc(e.logradouro)}, ${esc(e.numero)}${e.complemento ? ' - ' + esc(e.complemento) : ''} · ${esc(e.bairro)} · ${esc(e.cidade)}/${esc(e.uf)} · CEP ${esc(fmtCep(e.cep))}</span>
  </div>`;
}
function renderPedidos() {
  const q = norm(filtro.q);
  const lista = pedidos.filter(p => (!filtro.status || (STATUS_ANTIGO[p.status] || p.status) === filtro.status)
    && (!filtro.metodo || (p.pagamento?.metodo || 'whatsapp') === filtro.metodo)
    && (!q || norm([p.nome, p.email, p.id, num6(p.id), p.cliente?.nome].join(' ')).includes(q)
      || (so(filtro.q).length >= 3 && [p.cliente?.doc, p.cliente?.telefone].some(x => so(x).includes(so(filtro.q))))));
  $('conteudo').innerHTML = `
    <div class="filters">
      <select id="fSt"><option value="">Todos os status</option>${Object.entries(STATUS).map(([k, v]) => `<option value="${k}" ${filtro.status === k ? 'selected' : ''}>${v}</option>`).join('')}</select>
      <select id="fMt"><option value="">Todas as formas de pagamento</option>${Object.entries(PAGTO).map(([k, v]) => `<option value="${k}" ${filtro.metodo === k ? 'selected' : ''}>${v}</option>`).join('')}</select>
      <input id="fQ" placeholder="Buscar: nº, cliente, CPF/CNPJ, telefone" value="${esc(filtro.q)}">
    </div>
    ${lista.length ? lista.map(p => {
      const c = p.cliente, pg = p.pagamento || { metodo: 'whatsapp', status: 'pendente' }, st = STATUS_ANTIGO[p.status] || p.status;
      const avisos = conferir(p);
      return `<div class="box">
        <div class="ped-hd">
          <div><b>Pedido ${esc(num6(p.id))}</b> <span class="st st-${esc(st)}">${esc(stNome(p.status))}</span>
            <div class="muted">${data(p.criadoEm)} · ${esc(PAGTO[pg.metodo] || pg.metodo)} <span class="st pg-${esc(pg.status)}">${esc(PGST[pg.status] || pg.status)}</span></div></div>
          <b>${brl(p.total)}</b>
        </div>
        <div class="muted" style="margin-top:6px">${p.entrega?.tipo === 'entrega' ? '🚚 Entrega no endereço do cliente' : '🏪 Retirada no balcão'}</div>
        ${blocoCliente(c, p)}
        <div class="itens">${(p.itens || []).map(i => `<div>${esc(i.q)}x <b>${esc(i.un || '')} — ${esc(i.nome)}</b> <span class="muted">— ${esc(i.spec)} · ${brl(i.preco * i.q)}</span></div>`).join('')}
          ${p.obs ? `<div class="muted" style="margin-top:6px">Obs.: ${esc(p.obs)}</div>` : ''}
          ${p.arte ? `<div style="margin-top:6px">🎨 Arte enviada: <b>${esc(p.arte.nome)}</b> <button class="btn sm light" data-arte="${esc(p.arte.caminho)}">Baixar</button></div>` : ''}</div>
        ${avisos.length ? `<div class="aviso">⚠️ Confira os valores antes de confirmar:<br>${avisos.map(esc).join('<br>')}</div>` : ''}
        <div class="row-act">
          <select data-st="${esc(p.id)}" style="width:auto">${Object.entries(STATUS).map(([k, v]) => `<option value="${k}" ${st === k ? 'selected' : ''}>${v}</option>`).join('')}</select>
          ${pg.metodo === 'whatsapp' && p.pagamento ? `<select data-pg="${esc(p.id)}" style="width:auto">${['pendente', 'aprovado', 'recusado', 'estornado'].map(k => `<option value="${k}" ${pg.status === k ? 'selected' : ''}>Pagamento: ${PGST[k]}</option>`).join('')}</select>` : ''}
          ${c ? `<a class="btn sm wa" target="_blank" rel="noopener" href="${waCli(c.telefone, `Olá, ${c.nome.split(' ')[0]}! Aqui é do Grupo WD, sobre o seu pedido nº ${num6(p.id)}:`)}">💬 WhatsApp</a>
            <a class="btn sm light" href="tel:+55${so(c.telefone)}">📞 Ligar</a>
            <button class="btn sm light" data-ficha="${esc(p.uid)}">👤 Ficha do cliente</button>` : ''}
          <span style="flex:1"></span>
          <button class="btn sm red" data-del="${esc(p.id)}">Excluir</button>
        </div>
      </div>`;
    }).join('') : '<div class="box muted">Nenhum pedido encontrado.</div>'}`;
  $('fSt').onchange = e => { filtro.status = e.target.value; renderPedidos(); };
  $('fMt').onchange = e => { filtro.metodo = e.target.value; renderPedidos(); };
  manterFoco('fQ', v => { filtro.q = v; renderPedidos(); });
  document.querySelectorAll('[data-st]').forEach(s => s.onchange = async () => {
    try { await WD.mudarStatus(s.dataset.st, s.value); pedidos.find(p => p.id === s.dataset.st).status = s.value; toast('Status atualizado ✔'); render(); }
    catch (e) { alert('Não foi possível mudar o status: ' + e.message); }
  });
  document.querySelectorAll('[data-pg]').forEach(s => s.onchange = async () => {
    try { await WD.marcarPagamento(s.dataset.pg, s.value); pedidos.find(p => p.id === s.dataset.pg).pagamento.status = s.value; toast('Pagamento atualizado ✔'); render(); }
    catch (e) { alert(e.message); }
  });
  document.querySelectorAll('[data-ficha]').forEach(b => b.onclick = () => { const c = clientes.find(x => x.id === b.dataset.ficha); filtroCli = c?.cadastro?.doc || c?.email || ''; aba = 'clientes'; render(); });
  document.querySelectorAll('[data-arte]').forEach(b => b.onclick = async () => { try { open(await WD.linkArte(b.dataset.arte), '_blank'); } catch (e) { alert(e.message); } });
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if (!confirm('Excluir este pedido definitivamente?')) return;
    try { await WD.excluirPedido(b.dataset.del); pedidos = pedidos.filter(p => p.id !== b.dataset.del); toast('Pedido excluído'); render(); }
    catch (e) { alert(e.message); }
  });
}

/* ================= CLIENTES (CRM) ================= */
function renderClientes() {
  const q = norm(filtroCli), qd = so(filtroCli);

function reduzirFoto(arquivo) {
  return new Promise((ok, erro) => {
    const img = new Image();
    img.onload = () => {
      const lado = 800, c = document.createElement('canvas');
      c.width = lado; c.height = lado;
      const g = c.getContext('2d'); g.fillStyle = '#fafafa'; g.fillRect(0, 0, lado, lado);
      const k = Math.min(lado / img.width, lado / img.height), w = img.width * k, h = img.height * k;
      g.drawImage(img, (lado - w) / 2, (lado - h) / 2, w, h);
      let q = 0.85, url = c.toDataURL('image/webp', q);
      while (url.length > 600000 && q > 0.4) { q -= 0.1; url = c.toDataURL('image/webp', q); }
      if (!url.startsWith('data:image/webp')) url = c.toDataURL('image/jpeg', 0.8);
      URL.revokeObjectURL(img.src); ok(url);
    };
    img.onerror = erro;
    img.src = URL.createObjectURL(arquivo);
  });
}
const slugify = t => norm(t).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '').slice(0, 80);
async function salvarProduto() {
  const p = editando.prod, m = editando.meta;
  let s = editando.slug;
  if (!p.nome) return alert('Informe o nome do produto.');
  if (!p.attrs.length) return alert('Informe ao menos um atributo (ex.: Formato).');
  if (!editando.slug && !m.deps.length) return alert('Escolha ao menos uma categoria para o produto aparecer no site.');
  for (const v of p.vars) {
    if (!v.q.length) return alert('Cada combinação precisa de ao menos uma quantidade.');
    for (const q of v.q) if (!(q[0] > 0) || !(q[1] > 0)) return alert('Confira as quantidades e preços: todos precisam ser maiores que zero.');
    if (new Set(v.q.map(q => q[0])).size !== v.q.length) return alert('Há quantidades repetidas na mesma combinação.');
  }
  if (!s) {
    s = slugify(p.nome); let n = 2; const base = s;
    while (CAT.fams[s] || ajustes[s]) s = `${base}-${n++}`;
    if (!s) return alert('Nome inválido.');
  }
  const novo = !editando.slug || ajustes[s]?.novo;
  const a0 = ajustes[s] || {};
  // códigos (sku) para as linhas novas
  let k = 0; p.vars.forEach(v => v.q.forEach(q => { if (q[2] == null) q[2] = `n${Date.now().toString(36)}${k++}`; }));
  const aj = { ativo: m.ativo, destaque: m.destaque, nome: novo || p.nome !== CAT.fams[s]?.n ? p.nome : '' };
  if (m.promoPct > 0) aj.promo = { pct: m.promoPct, ...(m.promoAte ? { ate: new Date(m.promoAte + 'T23:59:59').getTime() } : {}) };
  if (m.deps.length) aj.deps = m.deps;
  if (editando.foto) aj.foto = Date.now();
  const gravarTabela = editando.tabelaMudou || novo || a0.editado;
  if (gravarTabela) {
    let min = null;
    p.vars.forEach((v, vi) => v.q.forEach(q => { if (!min || q[1] < min.q[1]) min = { vi, q, v }; }));
    aj[novo ? 'novo' : 'editado'] = true;
    aj.resumo = { p: [min.q[0], min.q[1], min.vi], c: p.vars.length,
      s: [min.v.a.Formato, min.v.a.Cor, min.v.a.Acabamento].filter(Boolean).join(' - ') || Object.values(min.v.a).filter(Boolean).slice(0, 2).join(' - ') };
  }
  try {
    if (gravarTabela) await WD.salvarProduto(s, { nome: p.nome, desc: p.desc, attrs: p.attrs, vars: p.vars });
    else if (p.desc && p.desc !== (FAM[s]?.desc || '')) {
      // só a descrição mudou num produto do catálogo: grava a tabela atual como editada
      await WD.salvarProduto(s, { nome: p.nome, desc: p.desc, attrs: p.attrs, vars: p.vars });
      aj.editado = true; aj.resumo = { p: [p.vars[0].q[0][0], p.vars[0].q[0][1], 0], c: p.vars.length, s: CAT.fams[s]?.s || '' };
    }
    if (editando.fotoMudou) { if (editando.foto) await WD.salvarFoto(s, editando.foto); else await WD.removerFoto(s); }
    const vazio = aj.ativo && !aj.destaque && !aj.nome && !aj.promo && !aj.deps && !aj.foto && !aj.editado && !aj.novo;
    if (vazio) { await WD.removerAjuste(s); delete ajustes[s]; } else { await WD.salvarAjuste(s, aj); ajustes[s] = aj; }
    if (aj.novo) CAT.fams[s] = { n: p.nome, img: '', p: aj.resumo.p, s: aj.resumo.s, c: aj.resumo.c };
    delete FAM[s];
    toast('Produto salvo ✔');
    editando = { slug: s }; renderEditor();
  } catch (e) { console.error(e); alert('Não foi possível salvar: ' + e.message); }
}
async function restaurarProduto() {
  const s = editando.slug;
  if (!confirm('Voltar às combinações e preços originais do catálogo? As alterações de tabela serão perdidas.')) return;
  try {
    await WD.removerProduto(s);
    const a = { ...ajustes[s] }; delete a.editado; delete a.resumo;
    if (a.ativo !== false && !a.destaque && !a.nome && !a.promo && !a.deps && !a.foto) { await WD.removerAjuste(s); delete ajustes[s]; }
    else { await WD.salvarAjuste(s, a); ajustes[s] = a; }
    delete FAM[s]; toast('Produto restaurado ✔'); editando = { slug: s }; renderEditor();
  } catch (e) { alert(e.message); }
}
async function excluirProduto() {
  const s = editando.slug;
  if (!confirm(`Excluir "${nomeDe(s)}" do site?`)) return;
  try {
    if (ajustes[s]?.novo) {
      await Promise.all([WD.removerProduto(s), WD.removerFoto(s).catch(() => {}), WD.removerAjuste(s)]);
      delete ajustes[s]; delete CAT.fams[s];
    } else {
      const a = { ...(ajustes[s] || {}), excluido: true, ativo: false };
      await WD.salvarAjuste(s, a); ajustes[s] = a;
    }
    toast('Produto excluído'); editando = null; renderProdutos();
  } catch (e) { alert(e.message); }
}

/* ================= CONFIGURAÇÕES ================= */
async function salvarBalcao() {
  const balcao = $('cBalcao').value.trim(), horario = $('cHorario').value.trim();
  try { await WD.salvarConfig({ mult: mult(), balcao, horario }); Object.assign(config, { balcao, horario }); toast('Balcão salvo ✔'); } catch (e) { alert(e.message); }
}
function renderConfig() {
  $('conteudo').innerHTML = `
    <div class="box">
      <h3>Preço dos produtos do catálogo</h3>
      <p class="muted" style="margin:6px 0 12px">Preço ao cliente = preço de referência × multiplicador. Vale para todos os produtos que não foram editados manualmente (os editados têm preço próprio).</p>
      <div class="row-act"><label style="font-weight:700">Multiplicador <input id="cMult" type="number" min="1" max="10" step="0.05" value="${mult()}" style="width:110px"></label>
        <button class="btn gold" id="cSalvar">Salvar</button></div>
    </div>
    <div class="box">
      <h3>Balcão de retirada</h3>
      <p class="muted" style="margin:6px 0 12px">Aparece no checkout (opção "Retirar no balcão") e nos detalhes do pedido do cliente.</p>
      <label class="muted">Endereço<input id="cBalcao" maxlength="300" value="${esc(config.balcao || '')}" placeholder="Rua, número - bairro - cidade/UF, CEP"></label>
      <label class="muted" style="display:block;margin-top:8px">Horário de funcionamento<textarea id="cHorario" rows="3" maxlength="300" placeholder="Segunda a sexta: 09:00 às 18:00&#10;Sábado: 09:00 às 12:00">${esc(config.horario || '')}</textarea></label>
      <button class="btn gold" id="cBalSalvar" style="margin-top:10px">Salvar balcão</button>
    </div>
    <div class="box">
      <h3>Acesso ao painel</h3>
      <p class="muted" style="margin-top:6px">${WD.ADMIN_EMAILS.map(esc).join(' · ')}</p>
    </div>
    <div class="box">
      <h3>Pagamento online (PIX e cartão)</h3>
      <p style="margin-top:6px">${WD.pagamentoOnline ? '✅ Ativo (Mercado Pago).' : '⏳ Ainda não ativado. Os clientes finalizam pelo WhatsApp e você marca o pagamento manualmente em cada pedido.'}</p>
      <p class="muted" style="margin-top:6px">Para ativar: plano Blaze no Firebase + credenciais do Mercado Pago (veja o LEIA-ME.md).</p>
    </div>`;
  $('cBalSalvar').onclick = salvarBalcao;
  $('cSalvar').onclick = async () => {
    const v = parseFloat($('cMult').value);
    if (!(v >= 1 && v <= 10)) return alert('Informe um multiplicador entre 1 e 10.');
    if (!confirm(`Todos os preços do catálogo passarão a ser referência × ${String(v).replace('.', ',')}. Confirmar?`)) return;
    try { await WD.salvarConfig({ mult: v, balcao: config.balcao || '', horario: config.horario || '' }); config.mult = v; toast('Multiplicador salvo ✔'); render(); } catch (e) { alert(e.message); }
  };
}
</script>
</body>
